[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-image"
version = "0.1.0"
description = "Generate images with GPT Image 2 via ChatGPT OAuth — no API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Pulsyn"},
]
keywords = ["openai", "gpt-image", "image-generation", "chatgpt", "codex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
gpt-image = "gpt_image.cli:main"

[project.urls]
Homepage = "https://github.com/hffmnnj/gpt-image-cli"
Repository = "https://github.com/hffmnnj/gpt-image-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["gpt_image*"]
